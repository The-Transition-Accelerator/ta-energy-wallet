title: "Annual Cooling Loads"
question: "How much cooling energy is needed?"
topic: space_heating_cooling
description: >
  Total annual space cooling energy demand by climate zone, dwelling type, and
  envelope performance tier. Values represent thermal energy that must be
  removed from the home, not metered input energy.
source:
  name: "DSPM Canada Reference Library"
  detail: "Calibrated to CEUD data with climate zone adjustments based on cooling degree days."
notes:
  - "Loads are not year-varying; the same values apply across all projection years."
keys: [climate_zone, dwelling_type, envelope_tier]
columns:
  climate_zone:
    description: "Climate zone identifier"
    type: categorical
    values: [CZ_5, CZ_6, CZ_7A]
  dwelling_type:
    description: "Dwelling type category"
    type: categorical
    values: [sfd, row, apt, mob]
  envelope_tier:
    description: "Building envelope performance tier"
    type: categorical
    values: [poor, average, good]
  cooling_load_annual:
    description: "Total annual space cooling load for the home"
    type: numeric
    unit: "GJ/year"
    range: [5, 26]
